<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Campaign | Catalyst Crowd</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/campaigns.css">

    <style>
        .edit-page {
            max-width: 760px;
            margin: 50px auto;
            padding: 30px;
        }

        .edit-page h1 {
            margin-bottom: 10px;
        }

        .edit-page > p {
            margin-bottom: 28px;
            color: #666;
        }

        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .edit-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .edit-form input,
        .edit-form textarea,
        .edit-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6dce5;
            border-radius: 8px;
            font: inherit;
        }

        .edit-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .edit-form button {
            padding: 13px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        .save-button {
            background: #2563eb;
            color: white;
        }

        .cancel-button {
            background: #e9edf5;
            color: #263247;
            text-align: center;
            text-decoration: none;
        }

        .edit-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .edit-actions > * {
            flex: 1;
            min-width: 140px;
        }

        .edit-message {
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .edit-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .edit-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .image-preview {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }

        @media (max-width: 600px) {
            .edit-page {
                margin: 20px auto;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="edit-page">

        <h1>Edit Campaign</h1>

        <p>Update the information about your fundraising campaign.</p>

        <div id="editMessage" class="edit-message" role="status"></div>

        <form id="editCampaignForm" class="edit-form">

            <div>
                <label for="campaignTitle">Campaign Title</label>
                <input
                    type="text"
                    id="campaignTitle"
                    maxlength="100"
                    required
                >
            </div>

            <div>
                <label for="campaignDescription">Description</label>
                <textarea
                    id="campaignDescription"
                    maxlength="5000"
                    required
                ></textarea>
            </div>

            <div>
                <label for="campaignCategory">Category</label>
                <select id="campaignCategory" required>
                    <option value="">Select a category</option>
                    <option value="Education">Education</option>
                    <option value="Medical">Medical</option>
                    <option value="Environment">Environment</option>
                    <option value="Community">Community</option>
                    <option value="Animal Welfare">Animal Welfare</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div>
                <label for="campaignGoal">Fundraising Goal (₹)</label>
                <input
                    type="number"
                    id="campaignGoal"
                    min="1"
                    max="100000000"
                    step="1"
                    required
                >
            </div>

            <div>
                <label for="campaignDeadline">Deadline</label>
                <input
                    type="date"
                    id="campaignDeadline"
                    required
                >
            </div>

            <div>
                <label for="campaignImage">Image URL (optional)</label>
                <input
                    type="url"
                    id="campaignImage"
                    placeholder="https://example.com/image.jpg"
                >

                <img
                    id="imagePreview"
                    class="image-preview"
                    alt="Campaign image preview"
                >
            </div>

            <div class="edit-actions">
                <button
                    type="submit"
                    id="saveCampaignButton"
                    class="save-button"
                >
                    Save Changes
                </button>

                <a href="dashboard.html" class="cancel-button">
                    Cancel
                </a>
            </div>

        </form>

    </main>

    <script type="module" src="js/edit-campaign.js"></script>

</body>
</html>
